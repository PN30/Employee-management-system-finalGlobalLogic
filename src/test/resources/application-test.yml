spring:
  datasource:
    url: jdbc:h2:mem:ems_test;MODE=MySQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  flyway:
    enabled: false          # MySQL-specific objects (procedures/functions) are not run on H2
logging:
  level:
    root: WARN
